server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy vers l'API d'audit (service node "api")
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://api:3000/health;
    }

    location = /audit {
        try_files /audit/index.html =404;
    }
    location = /audit/formulaire {
        try_files /audit/formulaire/index.html =404;
    }
    location = /demos {
        try_files /demos/index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}